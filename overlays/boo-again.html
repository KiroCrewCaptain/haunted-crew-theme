<!doctype html>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: 'Fredoka', 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif; }
  .veil { position: absolute; inset: 0; animation: veil 4s ease forwards; }
  @keyframes veil { 0% { background: rgba(144,70,255,0); } 18% { background: rgba(144,70,255,0.22); } 78% { background: rgba(144,70,255,0.16); } 100% { background: rgba(144,70,255,0); } }
  .g { position: absolute; width: 110px; height: 110px; opacity: 0; animation: pop 3.4s cubic-bezier(.3,1.4,.5,1) forwards; }
  .g img { width: 100%; height: 100%; animation: wob .5s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: rotate(-7deg) translateY(4px); } to { transform: rotate(7deg) translateY(-4px); } }
  @keyframes pop {
    0% { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.2); }
    25% { opacity: 1; transform: translate(0, 0) scale(1.1); }
    35% { transform: translate(0, 0) scale(1); }
    80% { opacity: 1; transform: translate(0, -10px) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.6); }
  }
  .boo { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.2); opacity: 0;
    font-weight: 800; font-size: min(18vw, 170px); letter-spacing: .02em; color: #ff8a1f;
    -webkit-text-stroke: 6px #1b1030; paint-order: stroke fill;
    text-shadow: 0 10px 0 #9046ff, 0 0 40px rgba(255,138,31,.6);
    animation: boo 3.8s cubic-bezier(.3,1.6,.5,1) forwards; white-space: nowrap; }
  @keyframes boo {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-12deg); }
    22% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(4deg); }
    32% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    78% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); }
  }
  .sub { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); padding: 8px 18px; border-radius: 999px;
    font: 700 min(4vw, 24px) system-ui, sans-serif; background: #fff7ee; color: #2b1a45; border: 3px solid #1b1030;
    box-shadow: 0 5px 0 #1b1030; opacity: 0; animation: sub 3.8s ease forwards; white-space: nowrap; }
  @keyframes sub { 0%, 26% { opacity: 0; transform: translate(-50%, 10px); } 38%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .cf { position: absolute; left: 50%; top: 42%; width: 30px; height: 30px; object-fit: contain; opacity: 0; animation: cf 2.8s ease-out forwards; }
  @keyframes cf { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }

    build(); visible(true);
    setTimeout(function () { visible(false); document.getElementById('show').textContent = ''; }, 4200);
  }
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'theme:state') { reduced = !!d.reducedMotion; if (reduced) visible(false); }
  });
  if (REPEAT_MIN > 0) {
    visible(false);
    round = 1;
    setInterval(play, REPEAT_MIN * 60 * 1000);
  } else {
    play();
  }
})();
</script>
</body>
</html>
