      [-ex, ex].forEach(function (dx) {
        g.beginPath(); g.moveTo(dx, ey + s * 0.1);
        g.bezierCurveTo(dx - s * 0.14, ey, dx - s * 0.08, ey - s * 0.12, dx, ey - s * 0.04);
        g.bezierCurveTo(dx + s * 0.08, ey - s * 0.12, dx + s * 0.14, ey, dx, ey + s * 0.1); g.fill();
      });
    } else if (face === 'wink') {
      g.beginPath(); g.ellipse(-ex, ey, s * 0.06, s * 0.1, 0, 0, 6.283); g.fill();
      g.lineWidth = s * 0.05; g.strokeStyle = g.fillStyle; g.beginPath(); g.arc(ex, ey + s * 0.04, s * 0.07, Math.PI + 0.3, -0.3); g.stroke();
    } else {
      g.beginPath(); g.ellipse(-ex, ey, s * 0.065, s * 0.105, 0, 0, 6.283); g.fill();
      g.beginPath(); g.ellipse(ex, ey, s * 0.065, s * 0.105, 0, 0, 6.283); g.fill();
      if (face === 'sparkle') { g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + s * 0.1, ey - s * 0.12, s * 0.03, 0, 6.283); g.fill(); g.fillStyle = 'rgba(255,230,80,1)'; }
    }
    g.lineWidth = s * 0.05; g.strokeStyle = g.fillStyle; g.lineCap = 'round';
    g.beginPath();
    if (face === 'cat') { g.moveTo(-s * 0.12, s * 0.16); g.quadraticCurveTo(-s * 0.06, s * 0.24, 0, s * 0.16); g.quadraticCurveTo(s * 0.06, s * 0.24, s * 0.12, s * 0.16); g.stroke(); }
    else if (face === 'grin') { g.moveTo(-s * 0.18, s * 0.12); g.quadraticCurveTo(0, s * 0.36, s * 0.18, s * 0.12); g.closePath(); g.fill(); }
    else { g.arc(0, s * 0.08, s * 0.14, 0.3, Math.PI - 0.3); g.stroke(); }
    g.restore();
    g.restore();
  }

  function drawSign(x, y, s, sign, Q, t, i) {
    var w = Math.max(84, s * 2.1), h = Math.max(36, s * 0.7);
    var sway = reduced ? 0 : Math.sin(t * 0.7 + i) * 0.03;
    g.save(); g.translate(x, y); g.rotate(sway);
    g.strokeStyle = '#9c6b3a'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -s * 0.5); g.stroke();
    g.translate(0, -s * 0.5 - h);
    g.fillStyle = Q.sign; g.strokeStyle = sign[0] === 'TREAT' ? Q.treat : Q.trick; g.lineWidth = 2.5;
    roundRect(-w / 2, 0, w, h, 8); g.fill(); g.stroke();
    g.textAlign = 'center'; g.fillStyle = sign[0] === 'TREAT' ? Q.treat : Q.trick;
    g.font = '700 ' + Math.round(h * 0.3) + 'px system-ui, sans-serif'; g.fillText(sign[0] === 'TREAT' ? 'TREAT!' : 'TRICK!', 0, h * 0.4);
    g.fillStyle = Q.signInk; var fs = Math.round(h * 0.28);
    g.font = '600 ' + fs + 'px system-ui, sans-serif';
    while (g.measureText(sign[1]).width > w - 10 && fs > 8) { fs--; g.font = '600 ' + fs + 'px system-ui, sans-serif'; }
    g.fillText(sign[1], 0, h * 0.8);
    g.restore();
  }
  function roundRect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function drawGhost(name, x, y, h, flip, tilt) {
    var im = img[name]; if (!im || !im.complete || !im.naturalWidth) return;
    g.save(); g.translate(x, y); if (tilt) g.rotate(tilt); if (flip) g.scale(-1, 1);
    g.drawImage(im, -h / 2, -h, h, h); g.restore();
  }

  function bubble(x, y, text, Q) {
    g.font = '700 12px system-ui, sans-serif'; var w = g.measureText(text).width + 16;
    g.fillStyle = Q.sign; g.strokeStyle = '#ff8a1f'; g.lineWidth = 2;
    roundRect(x - w / 2, y - 24, w, 22, 10); g.fill(); g.stroke();
    g.fillStyle = Q.signInk; g.textAlign = 'center'; g.fillText(text, x, y - 9);
  }

  function frame() {
    var t = (Date.now() - t0) / 1000, Q = P[mode] || P.dark, i;
    g.clearRect(0, 0, W, H);
    if (mode === 'dark') {
      g.fillStyle = Q.star;
      for (i = 0; i < stars.length; i++) {
        var s = stars[i]; g.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.35 + s.p));
        g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, 6.283); g.fill();
      }
      g.globalAlpha = 1;
    } else {
      for (i = 0; i < clouds.length; i++) {
        var cl = clouds[i]; if (!reduced) { cl.x += cl.v / 30; if (cl.x > 1.2) cl.x = -0.2; }
        var cx = cl.x * W, cy = cl.y * H, r = 22 * cl.s; g.fillStyle = Q.cloud;
        g.beginPath(); g.arc(cx, cy, r, 0, 6.283); g.arc(cx + r, cy - r * 0.4, r * 1.1, 0, 6.283); g.arc(cx + r * 2.1, cy, r * 0.9, 0, 6.283); g.fill();
      }
    }
    var moon = drawMoon(t, Q);
    drawLights(t);

    // A witch Crew mate flies past the moon every 24s.
    var fp = (t % 60) / 12;
    if (!reduced && fp < 1) {
      var fx = W * (1.1 - fp * 1.3), fy = moon.my + Math.sin(fp * 6.28) * 30 - 10;
      drawGhost('witch', fx, fy + 40, Math.max(70, moon.r * 1.8), true, -0.2);
    }

    for (i = 0; i < bats.length; i++) {
      var b = bats[i]; if (!reduced) { b.x += b.v / 30; if (b.x > 1.1) { b.x = -0.1; b.y = rnd(0.15, 0.4); } }
      drawBat(b, t, Q);
    }

    // Hills.
    var base = patchY();
    g.fillStyle = Q.hill2;
    g.beginPath(); g.moveTo(0, H); g.lineTo(0, base - 30); g.quadraticCurveTo(W * 0.3, base - 70, W * 0.6, base - 30); g.quadraticCurveTo(W * 0.85, base - 5, W, base - 40); g.lineTo(W, H); g.fill();
    g.fillStyle = Q.hill1;
    g.beginPath(); g.moveTo(0, H); g.lineTo(0, base + 10); g.quadraticCurveTo(W * 0.5, base - 20, W, base + 10); g.lineTo(W, H); g.fill();

    // Pumpkin patch: carved Crew faces, signs flip between trick and treat.
    var n = pumpkinCount(), ps = Math.max(38, Math.min(62, W / 24));
    g.strokeStyle = Q.vine; g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, base + ps * 0.4); g.quadraticCurveTo(W * 0.1, base + ps * 0.7, W * 0.2, base + ps * 0.4);
    g.moveTo(W, base + ps * 0.4); g.quadraticCurveTo(W * 0.9, base + ps * 0.7, W * 0.8, base + ps * 0.4); g.stroke();
    var page = Math.floor(t / 15);
    for (i = 0; i < n; i++) {
      var px = pumpkinX(i, n), py = base + ps * 0.1;
      drawSign(px, py - ps * 0.45, ps * 0.8, SIGNS[(i + page) % SIGNS.length], Q, t, i);
      drawPumpkin(px, py, ps, FACES[i % FACES.length], t, i);
    }

    // Trick-or-treaters: walk, stop at a pumpkin, get candy, walk on.
    for (i = 0; i < walkers.length; i++) {
      var w = walkers[i], gh = Math.max(60, ps * 1.35);
      if (!reduced) {
        if (w.stop > 0) { w.stop -= 1 / 30; if (w.stop <= 0) w.stop = -1; }
        else {
          w.x += (w.x > 0.22 && w.x < 0.78 ? 4 : 1) * w.v / 30;
          for (var k = 0; k < n; k++) {
            var dx = Math.abs(w.x * W - (pumpkinX(k, n) - ps * 0.9));
            if (dx < 1.2 && w.said !== k + 1 && Math.random() < 0.6) {
              w.stop = 3.5; w.said = k + 1;
              pops.push({ x: pumpkinX(k, n), y: base, vx: rnd(-1.5, -0.5), vy: -5.5, life: 1.6, c: LIGHTS[Math.floor(Math.random() * LIGHTS.length)] });
            }
          }
          if (w.x > 1.08) walkers[i] = newWalker();
        }
      }
      var hop = w.stop > 0 ? 0 : Math.abs(Math.sin(t * 2.8 + w.p)) * 6;
      var wx = w.x * W, wy = H - 6 - hop;
      if (w.x > 0.22 && w.x < 0.78) continue; // behind the chat column: stay out of the way
      drawGhost(w.name, wx, wy, gh, false, w.stop > 0 ? 0 : Math.sin(t * 2.8 + w.p) * 0.04);
      if (w.stop > 1.8) bubble(wx, wy - gh, 'Trick or treat!', Q);
      else if (w.stop > 0) bubble(wx, wy - gh, 'Yum, candy!', Q);
    }

    // Candy pops arcing out of pumpkins.
    for (i = pops.length - 1; i >= 0; i--) {
      var p = pops[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 1 / 30;
      g.save(); g.translate(p.x, p.y); g.rotate(p.life * 6); g.fillStyle = p.c;
      g.fillRect(-7, -4, 14, 8); g.beginPath(); g.moveTo(-7, 0); g.lineTo(-12, -5); g.lineTo(-12, 5); g.fill();
      g.beginPath(); g.moveTo(7, 0); g.lineTo(12, -5); g.lineTo(12, 5); g.fill(); g.restore();
      if (p.life <= 0) pops.splice(i, 1);
    }
  }

  var last = 0;
  function loop(now) {
    if (!reduced && !document.hidden && now - last > 33) { last = now; frame(); }
    window.requestAnimationFrame(loop);
  }
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'theme:state') {
      if (d.mode === 'light' || d.mode === 'dark') mode = d.mode;
      reduced = !!d.reducedMotion; frame();
    }
  });
  window.addEventListener('resize', function () { size(); frame(); });
  Object.keys(img).forEach(function (k) { img[k].onload = frame; });
  size(); seed(); frame(); window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
