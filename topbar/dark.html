  var img = {};
  Object.keys(G).forEach(function (k) { var i = new Image(); i.src = G[k]; img[k] = i; });
  var CREW = ['witch', 'vamp', 'cat', 'mummy', 'frank'];
  var LIGHTS = ['#ff8a1f', '#a3e635', '#b98bff', '#ffd23f', '#ff7a9c', '#6fd3ff'];
  var c = document.getElementById('c'), g = c.getContext('2d');
  var W = 0, H = 0, DPR = 1, reduced = false, mode = 'dark', t0 = Date.now();
  var SKIT = 28, GAP = 2; // seconds per skit, seconds of quiet between
  var candies = [];

  function size() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * DPR; c.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function ghost(name, x, y, h, flip, tilt, pose) {
    var im = img[name + '-' + (pose || 'still')]; if (!im || !im.complete || !im.naturalWidth) return;
    g.save(); g.translate(x, y); if (tilt) g.rotate(tilt); if (flip) g.scale(-1, 1);
    g.drawImage(im, -h / 2, -h, h, h); g.restore();
  }
  // Pumpkin art ('pumpkin' or 'jack'), centred on its body so it can roll.
  function pumpkin(x, y, s, rot, name) {
    var im = img[name || 'pumpkin'];
    if (!im || !im.complete || !im.naturalWidth) return;
    var w = s * 1.36, h = w * im.naturalHeight / im.naturalWidth;
    g.save(); g.translate(x, y); g.rotate(rot);
    g.drawImage(im, -w / 2, -h * 0.65, w, h);
    g.restore();
  }
  // Chasing bat: two wing frames swapped as the wings beat.
  function bat(x, y, t, s) {
    var im = img[Math.sin(t * 18) > 0 ? 'bat-up' : 'bat-down'];
    if (!im || !im.complete || !im.naturalWidth) return;
    var w = s * 4.4, h = w * im.naturalHeight / im.naturalWidth;
    g.drawImage(im, x - w / 2, y - h * 0.72, w, h);
  }
  function text(s, x, y, col) {
    g.font = '800 12px system-ui, sans-serif'; g.textAlign = 'center';
    g.lineWidth = 3; g.strokeStyle = mode === 'dark' ? '#1d1533' : '#fff7ee'; g.strokeText(s, x, y);
    g.fillStyle = col; g.fillText(s, x, y);
  }

  var GH = 0; // ghost height, set per frame
  function skitHop(p, t) {
    var span = W + 200, head = p * span - 20;
    for (var k = 0; k < 5; k++) {
      var x = head - k * 34; if (x < -30 || x > W + 30) continue;
      var ph = t * 2.6 + k * 0.9, hop = Math.abs(Math.sin(ph)) * 10;
      ghost(CREW[k], x, H - 6 - hop, GH, false, Math.sin(ph) * 0.08, 'bag');
      if (Math.sin(ph) > 0.99 && candies.length < 30) candies.push({ x: x, y: H - 14 - hop, vx: -1 - Math.random(), vy: -3 - Math.random() * 2, life: 1.2, k: 'candy-' + (k % 4 + 1) });
    }
  }
  function skitRoll(p, t) {
    var px = W + 40 - p * (W + 120), rot = -p * (W + 120) / 22;
    pumpkin(px, H - 15, 22, rot, 'jack');
    var cx = W * 0.5;
    for (var k = 0; k < 4; k++) {
      var x = cx - 70 + k * 46, d = x - px;
      var jump = Math.abs(d) < 34 ? Math.cos(d / 34 * Math.PI / 2) * 22 : 0;
      ghost(CREW[(k + 3) % CREW.length], x, H - 6 - jump, GH, true, jump ? -0.25 : 0);
      if (jump > 16) text('wheee!', x, 12, '#ff8a1f');
    }
  }
  function skitChase(p, t) {
    if (p < 0.5) {
      var q = p / 0.5, x = -40 + q * (W + 120);
      ghost('cat', x, H - 6 - Math.abs(Math.sin(t * 4.5)) * 6, GH, false, 0.1, 'flying');
      bat(x - 60, H - 26 + Math.sin(t * 3.5) * 5, t, 7);
      if (q > 0.2 && q < 0.8) text('eek!', x, 12, '#ff7a9c');
    } else {
      var r = (p - 0.5) / 0.5, bx = W + 40 - r * (W + 220);
      bat(bx, H - 26 + Math.sin(t * 3.5) * 6, t, 7);
      for (var k = 0; k < 4; k++) {
        var gx = bx + 70 + k * 34;
        ghost(CREW[k * 2 % CREW.length], gx, H - 6 - Math.abs(Math.sin(t * 4 + k)) * 7, GH, true, -0.08, 'flying');
      }
      if (r > 0.25 && r < 0.75) text('BOO!', bx + 90, 12, '#ff8a1f');
    }
  }
  function skitConga(p, t) {
    var head = p * (W + 260) - 20;
    for (var k = 0; k < 7; k++) {
      var x = head - k * 30; if (x < -30 || x > W + 30) continue;
      var wave = Math.sin(t * 2.2 - k * 0.7);
      ghost(CREW[(k + 1) % CREW.length], x, H - 8 - (wave + 1) * 4, GH, false, wave * 0.12, 'float');
      if (k % 3 === 0) {
        var ny = 14 + Math.sin(t * 3 + k) * 4, nx = x + 14 + Math.sin(t * 2 + k) * 4;
        g.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5 + k);
        text(k % 2 ? '♫' : '♪', nx, ny, LIGHTS[k % LIGHTS.length]);
        g.globalAlpha = 1;
      }
    }
  }
  var SKITS = [skitHop, skitRoll, skitChase, skitConga];

  function frame() {
    var t = (Date.now() - t0) / 1000;
    g.clearRect(0, 0, W, H);
    GH = Math.max(24, H - 10);
    if (reduced) { ghost('witch', W * 0.12, H - 6, GH, false, 0); ghost('cat', W * 0.12 + 32, H - 6, GH, false, 0); return; }
    var cycle = SKIT + GAP, n = Math.floor(t / cycle), p = (t % cycle) / SKIT;
    // Always on: two Crew mates chill by a pumpkin near the right edge.
    var rx = W - 70;
    pumpkin(rx, H - 15, 20, Math.sin(t * 0.8) * 0.05, 'pumpkin');
    ghost('cat', rx - 34, H - 6 - Math.abs(Math.sin(t * 1.1)) * 3, GH, false, Math.sin(t * 0.9) * 0.06);
    ghost('witch', rx + 34, H - 6 - Math.abs(Math.sin(t * 1.1 + 1.5)) * 3, GH, true, Math.sin(t * 0.9 + 1) * 0.06);
    if (p <= 1) SKITS[n % SKITS.length](p, t);
    for (var i = candies.length - 1; i >= 0; i--) {
      var cd = candies[i]; cd.x += cd.vx; cd.y += cd.vy; cd.vy += 0.3; cd.life -= 1 / 25;
      if (cd.y > H - 6) { cd.y = H - 6; cd.vy *= -0.5; }
      var ci = img[cd.k];
      if (ci && ci.complete && ci.naturalWidth) {
        var cs = 11 / Math.max(ci.naturalWidth, ci.naturalHeight);
        g.globalAlpha = Math.max(0, Math.min(1, cd.life * 2));
        g.save(); g.translate(cd.x, cd.y); g.rotate(cd.life * 5);
        g.drawImage(ci, -ci.naturalWidth * cs / 2, -ci.naturalHeight * cs / 2, ci.naturalWidth * cs, ci.naturalHeight * cs);
        g.restore(); g.globalAlpha = 1;
      }
      if (cd.life <= 0) candies.splice(i, 1);
    }
  }
  var last = 0;
  function loop(now) {
    if (!document.hidden && now - last > 40) { last = now; if (!reduced) frame(); }
    window.requestAnimationFrame(loop);
  }
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'theme:state') {
      if (d.mode === 'light' || d.mode === 'dark') mode = d.mode;
      reduced = !!d.reducedMotion; frame();
    }
  });
  window.addEventListener('resize', function () { size(); frame(); });
  Object.keys(img).forEach(function (k) { img[k].onload = frame; });
  size(); frame(); window.requestAnimationFrame(loop);
})();
</script>
